# CI (nextest) skips the tests that fit cost laws to wall-clock timings too short to survive a busy
# machine: on the 32-core CI runner they flipped verdicts (2.00x growth against a 3.0x floor; a
# direct DFT fitted as Polynomial { degree: 0.26 }) and passed on a rerun. `cargo test` still runs
# them; `cargo nextest run --ignore-default-filter` does too.
[profile.default]
default-filter = """
not (
    (binary(bounds_atlas) & test(=time_laws_join_the_verdict))
  | (binary(representation_conformance) & (
        test(=the_phase_field_axis_certifies_the_iqp_core_and_fails_on_the_full_circuit)
      | test(=the_braided_axis_certifies_a_braid_family_at_every_width)
    ))
  | (binary(e8_across) & test(=the_native_direct_dft_costs_exponentially_in_tower_depth))
)
"""
