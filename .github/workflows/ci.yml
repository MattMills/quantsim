name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Jobs run on the self-hosted hippo runners. Their job-started hook cleans the workspace but
# keeps target/, so checkouts use `clean: false` and each build is incremental against that
# runner's previous one; ~/.cargo persists on the runner too.
jobs:
  check:
    name: fmt + clippy + test
    runs-on: [self-hosted, hippo]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # `--tests` restricts the build to test targets. Without it cargo
      # also compiles all 85 examples, which `cargo test` never runs —
      # measured at 453s of 1226s CPU, 37% of the build, entirely
      # redundant here because the Clippy step above already builds
      # `--all-targets` and so fails on a broken example.
      - name: Tests
        run: cargo nextest run --workspace --locked --no-fail-fast --release --tests
      - name: Doctests
        run: cargo test --workspace --doc --locked --release
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
