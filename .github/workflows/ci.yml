name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # `--tests` restricts the build to test targets. Without it cargo
      # also compiles all 85 examples, which `cargo test` never runs —
      # measured at 453s of 1226s CPU, 37% of the build, entirely
      # redundant here because the Clippy step above already builds
      # `--all-targets` and so fails on a broken example.
      - name: Tests
        run: cargo test --release --tests
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
