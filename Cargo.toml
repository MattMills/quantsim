[package]
name = "quantsim"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "In-house research quantum simulator: registry-based gate library over swappable amplitude algebras (R, C, H, O, ...) with dense, sparse, and adaptive state-vector backends"
repository = "https://github.com/MattMills/quantsim"
publish = false

[dependencies]
num-complex = "0.4"
rustc-hash = "2"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "gates"
harness = false

[[bench]]
name = "width"
harness = false

[profile.bench]
debug = true
