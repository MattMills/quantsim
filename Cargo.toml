[package]
name = "quantsim"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "In-house research quantum simulator: registry-based gate library over swappable amplitude algebras (R, C, H, O, ...) with dense, sparse, and adaptive state-vector backends"
repository = "https://github.com/MattMills/quantsim"
publish = false

[dependencies]
num-complex = "0.4"
rustc-hash = "2"
# Opposed Mathematics (exact cyclotomic amplitudes, IPG states, Pauli
# Hamiltonians), bridged in `quantsim::opposed` and re-exported as
# `quantsim::om`. Pinned to a commit; bump `rev` to update.
opposed_mathematics = { git = "https://github.com/2bn-dev/opposed_mathematics", rev = "4ad1199e19a4baff3275824786020f557f7f45b9", optional = true }

[features]
default = ["opposed-math"]
opposed-math = ["dep:opposed_mathematics"]

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[example]]
name = "opposed_bridge"
required-features = ["opposed-math"]

[[bench]]
name = "gates"
harness = false

[[bench]]
name = "width"
harness = false

[profile.bench]
debug = true

# The tests are numerics: an unoptimized build spends its time in float
# loops inside the library, not in the assertions. Optimizing the dev and
# test profiles keeps `debug_assert!` and overflow checks on — so nothing
# a test can catch is switched off — while cutting the suite's wall time
# by more than an order of magnitude.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
